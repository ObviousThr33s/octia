name: verify

# The same two gates tools/verify.ps1 runs locally: build, then in-world tests
# on a headless dedicated server. No display, no Mojang account, no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Matches java_version in gradle.properties. Kept explicit rather than
      # letting the foojay resolver download a JDK on every CI run.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The checked-in wrapper is the point: CI and a developer machine resolve
      # the identical Gradle and Loom versions.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      # Not `./gradlew runGametest` directly. The gate has hung once after the
      # tests themselves passed, in silence, until the job timeout — see the
      # header of the script for what happened and what it dumps instead.
      - name: Game tests
        run: bash tools/gametest-ci.sh

      # The exit code is not the whole story, and tools/verify.ps1 has known it
      # for longer than this file has. Two green-looking failures it already
      # refuses and CI did not: a run that writes no report at all, because the
      # server died before the listener ever went off, and a report carrying
      # zero <testcase> nodes. No tests ran is a failure, not a pass.
      - name: Check the report says something
        if: success()
        run: |
          report=build/test-results/gametest/report.xml
          if [ ! -f "$report" ]; then
            echo "No report at $report."
            echo "The server exited before writing one - scroll up for the cause."
            exit 1
          fi
          cases=$(grep -o '<testcase' "$report" | wc -l)
          echo "$cases testcase(s) in the report."
          if [ "$cases" -eq 0 ]; then
            echo "No tests ran. That is a failure, not a pass."
            exit 1
          fi

      # Uploaded on failure too — a red run is exactly when the report matters.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/test-results/gametest/
          if-no-files-found: warn

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: octia-jar
          path: build/libs/*.jar
