<title>Sightlines Survey</title>
<style>
:root{
  --ground:#0B0D0D; --panel:#121615; --panel2:#171C1B; --edge:#2A3230; --edge2:#3D4744;
  --ink:#D8D3C8; --dim:#8A938F; --faint:#5C6663;
  --teal:#7FDBCA; --far:#3E6E66; --gold:#FFD24A; --rust:#E06C4E;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--edge);padding-bottom:20px}
.keg{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;white-space:pre;line-height:1.5}
h1{font-family:var(--mono);font-size:clamp(26px,5vw,38px);font-weight:600;letter-spacing:-.01em;
  margin:0;text-wrap:balance}
.sub{color:var(--dim);max-width:64ch;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
h2{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);margin:0 0 2px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--edge)}
section{display:flex;flex-direction:column;gap:14px}
p{margin:0;max-width:68ch}
p.note{color:var(--dim);font-size:14px}
.mapshell{border:1px solid var(--edge);background:var(--panel);border-radius:2px;overflow:hidden}
canvas{display:block;width:100%;height:min(66vh,560px);touch-action:none;cursor:crosshair;background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--edge);background:var(--panel2)}
button.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;color:var(--faint);border:1px solid var(--edge2);border-radius:2px;
  padding:5px 10px;cursor:pointer}
button.chip[aria-pressed="true"]{color:var(--ground);background:var(--ink);border-color:var(--ink)}
button.chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
  background:var(--edge);border-top:1px solid var(--edge)}
.cellr{background:var(--panel2);padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.cellr span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cellr b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.verdict.stand{color:var(--gold)} .verdict.break{color:var(--rust)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;font-style:normal}
.scroll{overflow-x:auto;border:1px solid var(--edge);border-radius:2px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--edge)}
th{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  background:var(--panel2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.ok{color:var(--teal)} td.no{color:var(--rust)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--edge2);color:var(--dim);padding:2px 7px;border-radius:2px}
.caveat{border-left:2px solid var(--rust);padding:2px 0 2px 14px;color:var(--dim);font-size:14px}
footer{border-top:1px solid var(--edge);padding-top:16px;font-family:var(--mono);font-size:11px;
  color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
