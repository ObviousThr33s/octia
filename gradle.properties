# ============================================================
# OCTIA — identity & version control panel
#
# This file is the single source of truth for the mod's name. The
# name is expected to change as goals, milestones, and metrics
# change, so nothing below is duplicated anywhere by hand:
#   - fabric.mod.json reads these via processResources
#   - the Java side keeps ONE constant (Octia.MOD_ID)
#   - tools/rename-mod.ps1 moves the rest mechanically
# See docs/NAMING.md before changing mod_id.
# ============================================================

# ---- Mod identity -------------------------------------------------
# mod_id is the ResourceLocation namespace. Fabric requires
# ^[a-z][a-z0-9_-]{1,63}$ — lowercase, no spaces, starts with a letter.
# It is also the on-disk name of assets/<mod_id>/ and data/<mod_id>/.
mod_id=octia
mod_name=Octia
# Alpha. SemVer prerelease, so Fabric's loader accepts it and orders it
# before 0.2.0 proper. .github/workflows/release.yml refuses to publish
# unless the pushed tag is exactly v${mod_version} — so the tag for this
# is v0.2.0-alpha.1 and nothing else.
mod_version=0.2.0-alpha.1
mod_description=A Serenity-class ship, called to the dig. Octia answers the archaeology hook and moors near the ruin it was summoned to.
mod_license=LGPL-3.0-only
# Authors are literal in fabric.mod.json: they are a JSON array, and a
# placeholder outside quotes would make the source file invalid JSON.
mod_sources=https://github.com/ObviousThr33s/octia

# maven_group + mod_package are kept separate on purpose: the group is
# the publishing coordinate, the package is where the Java lives. They
# happen to agree today.
maven_group=com.serenity
mod_package=com.serenity.octia
mod_main_class=Octia

# ---- Where the release stands, in KEG notation --------------------
# The jar's version is mod_version above and stays SemVer, because that
# is what Fabric's loader orders and what release.yml checks the tag
# against. These three are the release's NAME, which is a different job:
# they head the release card and title the GitHub release, so a download
# says which act it belongs to instead of only which number it is. See
# docs/NOTATION.md; the types are in com.serenity.octia.codex.
#
# mod_act is spelled, never numeric - ACT ONE, not ACT 1 - and stops at
# FIVE because the acts are the five era layers of the design brief.
# Act.parse() throws on anything else rather than defaulting, so a typo
# here fails the build instead of filing a release under the wrong era.
mod_act=ONE
# Zero-based, and MILESTONE 0 is the entry rather than the first
# achievement. NOT the same axis as .github/milestones.json, whose six
# entries are keyed by slug (echo-across-eras, the-loader-fork) and live
# on GitHub - those track issues, this tracks where the story is.
mod_milestone=0
# The status flags inside the artifact bracket:
# OCTIA_[0.2.0.A.L.P.H.A]_build. Single characters, dot-separated, read
# as a word when they spell one - S.A.F.E in the dev world's name is
# deliberate and so is this. Deliberately NOT derived from the -alpha in
# mod_version: the flags are what this build claims about itself, and
# guessing them from a SemVer prerelease would tie two things that are
# free to disagree.
mod_flags=A.L.P.H.A

# ---- Toolchain ----------------------------------------------------
# Known-good 1.21.1 pins, carried over from the Hexehedron build that
# already runs on this machine.
#
# Loom is held at 1.11.x by the GRADLE WRAPPER, not by Minecraft. Loom
# declares org.gradle.plugin.api-version in its module metadata — 1.13.4
# asks for 8.14, 1.14.10 for 9.2.0, 1.17.17 for 9.5.0 — and Gradle
# refuses a plugin variant above the Gradle running it. This repo's
# wrapper is 8.14.2, so the 1.13 line is the ceiling; 1.11.8 -> 1.12.7
# is a drop-in that needs no wrapper change.
#
# Newer Loom still builds 1.21.1. What changed at Loom 1.14 was the
# plugin ID, not the support: net.fabricmc.fabric-loom-remap for
# obfuscated Minecraft (1.21.11 and older), with plain fabric-loom kept
# for backwards compatibility and slated for removal in Loom 2.0.
# Fabric's own fabric-example-mod pins loom 1.17-SNAPSHOT on its 1.21.1
# branch. The unobfuscated runtime starts at Minecraft 26.1, not at any
# Loom version, and this project has no access widener at all.
minecraft_version=1.21.1
# This line is the pin. settings.gradle.kts reads it and states the version on
# the fabric-loom plugin request, so build.gradle.kts asks for the plugin with
# no version at all. It was a copy of the literal in build.gradle.kts until
# 2026-08-10, which meant moving it on its own changed nothing, silently.
loom_version=1.11.8
fabric_loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1
java_version=21

# ---- Gradle -------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
