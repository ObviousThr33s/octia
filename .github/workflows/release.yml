name: Release

# A tag publishes the jar. It runs the same two gates verify.yml runs first,
# because standing order 1 in OCTIA.md is that the local gate and the CI gate
# are one gate - a release path that only compiled would be a third, weaker
# gate, and the one whose output people actually download.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The tag names the release; gradle.properties names the jar inside it.
      # Nothing keeps the two honest, so tagging v0.2.0 against mod_version
      # 0.1.0 would publish "v0.2.0" containing octia-0.1.0.jar, silently.
      - name: Tag must agree with mod_version
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^mod_version=[[:space:]]*//p' gradle.properties | head -n1)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tagged, gradle.properties says $declared"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches mod_version=$declared"

      # Without this the release is titled with the bare tag, and a shelf of
      # them reads as a column of numbers. The act is what says where in the
      # story a build sits - see docs/NOTATION.md - so it goes in the title,
      # while mod_version stays the thing the tag is checked against above.
      # Read from the same file for the same reason: a hand-typed act would
      # drift from the one the release card prints two steps down.
      - name: Compose the release title
        id: title
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=[[:space:]]*//p" gradle.properties | head -n1 | tr -d '\r'; }
          name=$(prop mod_name); version=$(prop mod_version)
          act=$(prop mod_act); milestone=$(prop mod_milestone)
          case "$act" in
            ONE|TWO|THREE|FOUR|FIVE) ;;
            *) echo "::error::mod_act is spelled ONE..FIVE, never numeric, and says '$act'"; exit 1 ;;
          esac
          echo "title=$name $version - ACT $act, MILESTONE $milestone" >> "$GITHUB_OUTPUT"

      # Matches java_version in gradle.properties, as in verify.yml.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No `chmod +x gradlew` step here, deliberately. The bit is in the index
      # (mode 100755) since `git update-index --chmod=+x`; a chmod step would
      # hide it going missing again and leave every fresh clone broken. See the
      # note in docs/ROADMAP.md.
      - name: Build
        run: ./gradlew build --console=plain

      # Bounded, and dumps stacks instead of hanging to the job timeout. Same
      # wrapper verify.yml uses, for the same reason - see the script header.
      - name: Game tests
        run: bash tools/gametest-ci.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: build/test-results/gametest/
          if-no-files-found: warn

      # The half a jar cannot carry: which four versions must agree, how to
      # switch Octia on, a seed that was actually walked, and how to send a
      # verdict back. Generated rather than written, from the same
      # gradle.properties the tag was just checked against, so the Fabric API
      # version in the release notes cannot drift from the one this jar was
      # built with. pwsh is preinstalled on ubuntu-latest, and this is the same
      # script the owner runs locally - one card, one source, like the gates.
      - name: Release card
        shell: pwsh
        run: ./tools/release-card.ps1

      # build/libs holds the remapped jar and the sources jar that
      # withSourcesJar() produces; Loom's un-remapped dev jar goes to
      # build/devlibs and is correctly not picked up here.
      #
      # body_path leads and generate_release_notes appends its commit list
      # under it, so a downloader reads what to do before reading what changed.
      # prerelease is DERIVED, not declared. SemVer already answers this: a
      # hyphen in the version is what makes it a prerelease, which is the same
      # rule that makes Fabric's loader order 0.2.0-alpha.1 below 0.2.0. Left
      # unset, the action defaults to false and GitHub would badge an alpha as
      # "Latest" - the tag check above exists so the jar cannot lie about its
      # number, and this is that rule applied to the shelf it sits on.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.title.outputs.title }}
          files: build/libs/*.jar
          body_path: build/RELEASE-CARD.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
