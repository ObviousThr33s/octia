name: verify

# The same two gates tools/verify.ps1 runs locally: build, then in-world tests
# on a headless dedicated server. No display, no Mojang account, no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Matches java_version in gradle.properties. Kept explicit rather than
      # letting the foojay resolver download a JDK on every CI run.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The checked-in wrapper is the point: CI and a developer machine resolve
      # the identical Gradle and Loom versions.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: Game tests
        run: ./gradlew runGametest --console=plain

      # Uploaded on failure too — a red run is exactly when the report matters.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/test-results/gametest/
          if-no-files-found: warn

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: octia-jar
          path: build/libs/*.jar
